services:
  traefik:
    image: traefik:latest
    container_name: traefik_global
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"

      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

    networks:
      - traefik-public
    restart: unless-stopped

networks:
  traefik-public:
    external: true
